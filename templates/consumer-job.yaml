apiVersion: v1
kind: ConfigMap
metadata:
  name: consumer-config
data:
  get-script: |
    - !Wait
      time: 1m
    - !Get
      id: "GXeUYl3yZ2G2NKGlpej3JhCaYGlEooDRhx0T8NJG/G4="
    - !Wait
      time: 10m

---

apiVersion: batch/v1
kind: Job
metadata:
  name: consumer-job
spec:
  template:
    spec:
      containers:
      - name: eon-client
        image: 10.1.1.18:5000/eon-client
        command: [
          "eon-client",
          "--stdout",
          "--log-level", "debug",
          "--bootstrap-addr", "10.96.0.100",
          "--script-path", "/mnt/scripts/script.yaml",
          "--delay", "{{delay}}"
        ]
        volumeMounts:
        - name: scripts
          mountPath: "/mnt/scripts"
          readOnly: true
      volumes:
      - name: scripts
        configMap:
          name: consumer-config
          items:
          - key: "get-script"
            path: "script.yaml"
      restartPolicy: Never
  backoffLimit: 4
