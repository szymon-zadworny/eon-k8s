apiVersion: v1
kind: Service
metadata:
  name: 0-bootstrap-service
  labels:
    app: 0-bootstrap-service
spec:
  type: ClusterIP
  clusterIP: 10.96.0.100
  ports:
  - port: 22137
    protocol: TCP
  selector:
    app: 0-bootstrap-deployment

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: 0-bootstrap-deployment
  labels:
      app: 0-bootstrap-node
spec:
  replicas: 1
  selector:
    matchLabels:
      app: 0-bootstrap-deployment
  template:
    metadata:
      labels:
        app: 0-bootstrap-deployment
    spec:
      containers:
      - name: eon-client
        image: 10.1.1.18:5000/eon-client
        command: [
          "eon-client",
          "--stdout",
          "--log-level", "debug",
          "--bootstrap-mode",
          "--secret-key-seed", "1",
          "--script", "[!Wait {time: 30m}]"
        ]
        ports:
        - containerPort: 22137
